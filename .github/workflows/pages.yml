name: Deploy static website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Protect the existing customer storefront
        run: |
          expected="854f4646215be9f0a5aaacc72ad4b7b56ac58f3e"
          actual="$(git rev-parse HEAD:index.html)"
          if [ "$actual" != "$expected" ]; then
            echo "index.html changed from the approved baseline; stop deployment for review."
            exit 1
          fi

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check deployed Supabase Edge Functions
        run: |
          mkdir -p "$RUNNER_TEMP/edge-function-check"
          cp -R supabase/functions "$RUNNER_TEMP/edge-function-check/"
          cd "$RUNNER_TEMP/edge-function-check"
          deno check --node-modules-dir=auto \
            functions/razorpay-subscription-checkout/index.ts \
            functions/razorpay-verify-subscription-payment/index.ts \
            functions/razorpay-payment-webhook/index.ts

      - name: Validate website files and inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const required = ['index.html', 'portal.html', 'showcase.html', 'catalogue.html', 'apply-shop.html', 'owner.html', 'shopkeeper.html', 'my-orders.html', 'shopkeeper-benefits.html', 'demo-store.html', 'PAYMENT_SETUP.md'];
          const missing = required.filter(file => !fs.existsSync(file));
          if (missing.length) throw new Error('Missing required project files: ' + missing.join(', '));
          const pages = required.filter(file => file.endsWith('.html'));
          for (const file of pages) {
            const html = fs.readFileSync(file, 'utf8');
            const ids = [...html.matchAll(/\bid\s*=\s*["']([^"']+)["']/gi)].map(match => match[1]);
            const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
            if (duplicates.length) throw new Error(file + ' has duplicate element IDs: ' + [...new Set(duplicates)].join(', '));
            const scripts = [...html.matchAll(/<script\b(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)<\/script>/gi)];
            scripts.forEach((match, index) => {
              try { new Function(match[1]); }
              catch (error) { throw new Error(file + ' inline script ' + (index + 1) + ' has a syntax error: ' + error.message); }
            });
            console.log('Validated ' + file + ' (' + scripts.length + ' inline script(s))');
          }
          console.log('All required website files and inline JavaScript passed validation.');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare clean website artifact
        run: |
          mkdir -p .pages-site
          cp index.html portal.html showcase.html catalogue.html demo-store.html apply-shop.html owner.html shopkeeper.html shopkeeper-benefits.html my-orders.html password-security.js .pages-site/

      - name: Verify published artifact contains every website page
        run: |
          required=('index.html' 'portal.html' 'showcase.html' 'catalogue.html' 'demo-store.html' 'apply-shop.html' 'owner.html' 'shopkeeper.html' 'shopkeeper-benefits.html' 'my-orders.html' 'password-security.js')
          for file in "${required[@]}"; do
            if [ ! -f ".pages-site/$file" ]; then
              echo "Missing published artifact file: $file"
              exit 1
            fi
          done
          echo "All required website pages and security script are present in the published artifact."

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
