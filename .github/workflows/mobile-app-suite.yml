name: Android app suite foundation checks

on:
  push:
    branches: [mobile-app-foundation]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-app-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-all-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble Owner, Shopkeeper and Customer debug APKs
        working-directory: mobile
        run: gradle --no-daemon :app-owner:assembleDebug :app-shopkeeper:assembleDebug :app-customer:assembleDebug
