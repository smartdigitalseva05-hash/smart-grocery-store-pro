name: Static project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check hotel payment Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/hotel-payment-checkout/index.ts supabase/functions/hotel-payment-verify/index.ts
      - name: Scan reachable Git history for leaked credentials
        run: node scripts/scan-secret-history.mjs
      - name: Validate HTML scripts, IDs and business categories
        run: node scripts/validate-static.mjs
      - name: Test payment body limits and webhook signature helpers
        run: node --test tests/*.test.mjs
