name: Static project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML scripts, IDs and business categories
        run: node scripts/validate-static.mjs
      - name: Test Razorpay webhook body limits and signature helpers
        run: node --test tests/webhook-security.test.mjs
